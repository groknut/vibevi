[project]
name = "vibevi"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pdfplumber",
    "pymupdf",
    "python-docx",
    "openpyxl",
    "xlrd",
    "Pillow",
    "pyqt6>=6.11.0",
    "markdown",
    "mutagen",
    "PyYAML",
    "py7zr>=1.1.3",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project.scripts]
start = "main:main"
