<!doctype html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Моя первая веб-страница</title>
        <style>
            body {
                font-family: Arial, sans-serif;
                background-color: #f4f4f9;
                color: #333;
                margin: 0;
                padding: 20px;
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
            }
            .card {
                background: white;
                padding: 30px;
                border-radius: 12px;
                box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
                text-align: center;
                max-width: 400px;
            }
            h1 {
                color: #4a90e2;
            }
            button {
                background-color: #4a90e2;
                color: white;
                border: none;
                padding: 10px 20px;
                border-radius: 5px;
                cursor: pointer;
                font-size: 16px;
            }
            button:hover {
                background-color: #357abd;
            }
        </style>
    </head>
    <body>
        <div class="card">
            <h1>Привет от ИИ!</h1>
            <p>
                Это простая интерактивная HTML-страница со встроенными стилями и
                скриптом.
            </p>
            <button onclick="showAlert()">Нажми на меня</button>
        </div>

        <script>
            function showAlert() {
                alert("Кнопка работает! Поздравляем с созданием кода.");
            }
        </script>
    </body>
</html>
